version: 1.3.17
cache: true
endpoints:
  custom:
    - name: LiteLLM OCI
      apiKey: '${LITELLM_MASTER_KEY}'
      baseURL: 'http://litellm:4000/v1'
      models:
        default:
          - oci-gemini-2.5-pro
          - oci-gemini-2.5-flash
          - oci-gemini-2.5-flash-lite
          - oci-gpt-oss-120b
          - oci-gpt-oss-20b
          - oci-llama-3.3-70b
        fetch: true
      modelDisplayLabel: OCI via LiteLLM
