services:
  api:
    container_name: librechat
    image: registry.librechat.ai/librechat-ai/librechat-dev:latest
    restart: unless-stopped

    depends_on:
      - mongodb
      - meilisearch
      - rag_api

    ports:
      - "${PORT:-3080}:3080"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    env_file:
      - .env

    environment:
      HOST: 0.0.0.0
      PORT: 3080

      MONGO_URI: mongodb://mongodb:27017/LibreChat
      MEILI_HOST: http://meilisearch:7700

      RAG_PORT: ${RAG_PORT:-8000}
      RAG_API_URL: http://rag_api:${RAG_PORT:-8000}

      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp

      PROXY: ${PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}

      NO_PROXY: >-
        localhost,127.0.0.1,::1,
        mongodb,
        meilisearch,
        rag_api,
        vectordb,
        host.docker.internal

    volumes:
      - librechat_data:/app/data
      - librechat_images:/app/client/public/images
      - librechat_uploads:/app/uploads
      - librechat_logs:/app/logs
      - librechat_skill:/app/skill

      # Optional.
      # If you want librechat.yaml, use a Dokploy persistent mount
      # or ../files/librechat.yaml rather than mounting it from
      # the Git checkout.
      #
      # - ../files/librechat.yaml:/app/librechat.yaml:ro

  admin-panel:
    container_name: librechat-admin
    image: registry.librechat.ai/clickhouse/librechat-admin-panel:latest
    restart: unless-stopped

    depends_on:
      - api

    env_file:
      - .env

    environment:
      PORT: 3000
      SESSION_SECRET: ${ADMIN_PANEL_SESSION_SECRET}
      API_SERVER_URL: http://api:3080
      VITE_API_BASE_URL: ${DOMAIN_CLIENT:-http://localhost:3080}
      SESSION_COOKIE_SECURE: ${ADMIN_PANEL_SESSION_COOKIE_SECURE:-true}

    # Do not expose publicly unless you actually need the admin panel
    # through a separate Dokploy domain.
    expose:
      - "3000"

  mongodb:
    container_name: librechat-mongodb
    image: mongo:8.0.20
    restart: unless-stopped

    command: mongod --noauth

    volumes:
      - mongodb_data:/data/db

  meilisearch:
    container_name: librechat-meilisearch
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped

    environment:
      MEILI_HOST: http://meilisearch:7700
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

    volumes:
      - meilisearch_data:/meili_data

  vectordb:
    container_name: librechat-vectordb
    image: pgvector/pgvector:0.8.0-pg15-trixie
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-librechat}
      POSTGRES_USER: ${POSTGRES_USER:-librechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - pgvector_data:/var/lib/postgresql/data

  rag_api:
    container_name: librechat-rag-api
    image: registry.librechat.ai/librechat-ai/librechat-rag-api-dev-lite:latest
    restart: unless-stopped

    depends_on:
      - vectordb

    env_file:
      - .env

    environment:
      DB_HOST: vectordb
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-librechat}
      POSTGRES_USER: ${POSTGRES_USER:-librechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RAG_PORT: ${RAG_PORT:-8000}

volumes:
  librechat_data:
  librechat_images:
  librechat_uploads:
  librechat_logs:
  librechat_skill:

  mongodb_data:
  meilisearch_data:
  pgvector_data:
